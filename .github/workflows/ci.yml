name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]          # release.yml tests tagged builds itself
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON_PREFERENCE: only-system
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Fonts for Qt's offscreen platform on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - name: Linux libraries for Qt and MediaPipe
        if: runner.os == 'Linux'
        timeout-minutes: 10       # a slow package mirror fails fast instead of hanging; re-run the job
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libegl1 libgl1 libgles2 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: uv sync --frozen
      - run: uv run pytest -q
