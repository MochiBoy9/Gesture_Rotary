name: Release

# Publishes a GitHub Release with the installers for Windows, macOS and Linux:
#   - automatically, when a new __version__ in rotary/__init__.py reaches main (merge the version bump and
#     v<version> is built and published; nothing happens if that release already exists), or
#   - push a tag like v1.5.1 (matching __version__), or
#   - Actions → Release → Run workflow, with the tag typed in (it's created on the chosen branch if it
#     doesn't exist yet). Leave the tag empty to publish the branch's own __version__.
# Pull requests that touch the packaging only build (download the files from the run's artifacts).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["rotary/__init__.py"]     # main only; tag pushes always run
  pull_request:
    paths:
      - "Gesture Rotary.spec"
      - "installer/**"
      - "tools/build.py"
      - "tools/make_icon.py"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish as this release, e.g. v1.5.1 (empty = the branch's own version)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}          # the release to publish ('' = only build)
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        name: Which release, if any
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rotary/__init__.py)
          build=true
          auto=false        # the tag comes from __version__, not from the person releasing
          case "$EVENT" in
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$version" auto=true; fi ;;
            workflow_dispatch)
              if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"; else tag="v$version" auto=true; fi ;;
            *)
              tag="" ;;
          esac
          # An automatic release never overwrites one that's out already (type the tag to redo it).
          if [ "$auto" = true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already released, so this run doesn't publish anything."
            tag=""
            if [ "$EVENT" = push ]; then build=false; fi
          fi
          if [ -n "$tag" ]; then
            t="${tag#v}"
            if [ "${tag:0:1}" != "v" ] || [ "${t%%-*}" != "$version" ]; then
              echo "::error::Can't release $tag from $GITHUB_REF_NAME: its rotary/__init__.py says __version__ = \"$version\". Run the workflow on the branch that has version ${t%%-*}, or set __version__ there first."
              exit 1
            fi
            echo "::notice::Building and publishing $tag."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15            # Apple silicon (MediaPipe has no Intel-Mac build)
          - name: Linux
            os: ubuntu-22.04        # glibc 2.35: the oldest PySide6 supports, so it runs on the most distros
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON_PREFERENCE: only-system
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      # Optional: a Developer ID signs and notarises the Mac app (otherwise it's signed ad hoc).
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - name: Fonts for Qt's offscreen platform on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - name: Linux libraries for Qt and MediaPipe
        if: runner.os == 'Linux'
        timeout-minutes: 10       # a slow package mirror fails fast instead of hanging; re-run the job
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libegl1 libgl1 libgles2 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python tools/build.py

      - uses: actions/upload-artifact@v5
        with:
          name: GestureRotary-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0     # already compressed

  publish:
    name: Publish the release
    needs: [plan, build]
    if: needs.build.result == 'success' && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          pattern: GestureRotary-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum GestureRotary-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          version="${RELEASE_TAG#v}"
          # This version's section of CHANGELOG.md, then the install guide.
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          cat installer/RELEASE_NOTES.md >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Gesture Rotary ${{ env.RELEASE_TAG }}
          body_path: notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release/*
          fail_on_unmatched_files: true
