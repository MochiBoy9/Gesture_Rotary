name: Release

# Two ways to publish a GitHub Release with the installers for Windows, macOS and Linux:
#   - push a tag like v1.4.0 (matching rotary/__init__.py's __version__), or
#   - Actions → Release → Run workflow, with the tag typed in (it's created on the chosen branch if it
#     doesn't exist yet).
# "Run workflow" with no tag, and pull requests that touch the packaging, only build them (download
# them from the run's artifacts).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Gesture Rotary.spec"
      - "installer/**"
      - "tools/build.py"
      - "tools/make_icon.py"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish as this release, e.g. v1.4.0 (empty = only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The release being made: the pushed tag, or the one typed into "Run workflow" ('' = none).
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-15            # Apple silicon (MediaPipe has no Intel-Mac build)
          - name: Linux
            os: ubuntu-22.04        # glibc 2.35: the oldest PySide6 supports, so it runs on the most distros
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON_PREFERENCE: only-system
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      # Optional: a Developer ID signs and notarises the Mac app (otherwise it's signed ad hoc).
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6

      - name: The tag matches the app's version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' rotary/__init__.py)
          tag="${RELEASE_TAG#v}"
          if [ "${RELEASE_TAG:0:1}" != "v" ] || [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match __version__ $version in rotary/__init__.py (expected v$version)"
            exit 1
          fi

      - name: Fonts for Qt's offscreen platform on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - name: Linux libraries for Qt and MediaPipe
        if: runner.os == 'Linux'
        timeout-minutes: 10       # a slow package mirror fails fast instead of hanging; re-run the job
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libegl1 libgl1 libgles2 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Import the signing certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_IDENTITY != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python tools/build.py

      - uses: actions/upload-artifact@v5
        with:
          name: GestureRotary-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0     # already compressed

  publish:
    name: Publish the release
    needs: build
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: release
          pattern: GestureRotary-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum GestureRotary-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        run: |
          version="${RELEASE_TAG#v}"
          # This version's section of CHANGELOG.md, then the install guide.
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          cat installer/RELEASE_NOTES.md >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Gesture Rotary ${{ env.RELEASE_TAG }}
          body_path: notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release/*
          fail_on_unmatched_files: true
